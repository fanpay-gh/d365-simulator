[build]
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # schema.yaml se lee en runtime; debe viajar dentro del bundle de la función
  included_files = ["schema.yaml"]

# Las rutas de la función (token de Entra, Dataverse y /_mock) se declaran en
# `export const config = { path: [...] }` de netlify/functions/d365-mock.ts.
